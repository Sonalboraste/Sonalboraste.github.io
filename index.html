<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dance Videos</title>
<style>
  :root {
    --bg: #0f0f0f;
    --card-bg: #1a1a1a;
    --text: #f1f1f1;
    --accent: #ff4d67;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  /* ---- Password gate ---- */
  #gate {
    position: fixed;
    inset: 0;
    background: #0f0f0f;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  #gate-box {
    text-align: center;
    padding: 30px;
  }
  #gate-box h2 {
    margin-bottom: 16px;
    font-size: 1.4rem;
  }
  #gate-box input {
    padding: 10px 14px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #fff;
    font-size: 1rem;
    width: 240px;
  }
  #gate-box button {
    padding: 10px 18px;
    margin-left: 8px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  #gate-error {
    color: var(--accent);
    margin-top: 10px;
    font-size: 0.9rem;
    min-height: 20px;
  }
  #site-content {
    display: none;
  }
  /* ---- End password gate ---- */

  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #141414;
    border-bottom: 1px solid #2a2a2a;
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  nav a {
    color: #ccc;
    text-decoration: none;
    font-size: 0.9rem;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #333;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  nav a:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  header {
    text-align: center;
    padding: 50px 20px 40px 20px;
  }
  header h1 {
    font-size: 2.5rem;
    letter-spacing: 1px;
  }
  header p {
    color: #999;
    margin-top: 10px;
  }

  .category {
    max-width: 1100px;
    margin: 0 auto 60px auto;
    padding: 0 20px;
    scroll-margin-top: 70px;
  }
  .category h2 {
    font-size: 1.5rem;
    border-left: 4px solid var(--accent);
    padding-left: 12px;
    margin-bottom: 20px;
  }
  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .video-card {
    background: var(--card-bg);
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.2s ease;
  }
  .video-card:hover {
    transform: translateY(-5px);
  }
  .video-card iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    display: block;
  }
  .video-card .caption {
    padding: 12px;
    font-size: 0.95rem;
    color: #ddd;
  }

  /* ---- Video loading status (new) ---- */
  #video-status {
    max-width: 1100px;
    margin: 0 auto 40px auto;
    padding: 0 20px;
    text-align: center;
    color: #999;
  }
  #video-status button {
    margin-top: 12px;
    padding: 10px 18px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  .coming-soon {
    color: #777;
    font-style: italic;
  }
</style>
</head>
<body>

<!-- Password gate -->
<div id="gate">
  <div id="gate-box">
    <h2>Enter password to view</h2>
    <input type="password" id="gate-input" placeholder="Password" />
    <button onclick="checkPassword()">Enter</button>
    <div id="gate-error"></div>
  </div>
</div>

<!-- Site content, hidden until password is correct -->
<div id="site-content">

<nav>
  <a href="#merengue">Merengue</a>
  <a href="#cumbia">Cumbia</a>
  <a href="#reggaeton">Reggaeton</a>
  <a href="#salsa">Salsa</a>
  <a href="#bhangra">Bhangra</a>
  <a href="#garba">Garba</a>
  <a href="#marathi">Marathi</a>
  <a href="#bollywood-freestyle">Bollywood Freestyle</a>
  <a href="#english-spanish">English/Spanish</a>
</nav>

<header>
  <h1>My Dance Videos</h1>
  <p>A collection of different dance workouts, organized by category</p>
</header>

<!-- Shows "Loading videos..." or an error with a Try again button -->
<div id="video-status"></div>

<!-- Each section starts empty; the script below fills it from the API -->
<section class="category" id="merengue" data-category="Merengue">
  <h2>Merengue</h2>
  <div class="video-grid"></div>
</section>

<section class="category" id="cumbia" data-category="Cumbia">
  <h2>Cumbia</h2>
  <div class="video-grid"></div>
</section>

<section class="category" id="reggaeton" data-category="Reggaeton">
  <h2>Reggaeton</h2>
  <div class="video-grid"></div>
</section>

<section class="category" id="salsa" data-category="Salsa">
  <h2>Salsa</h2>
  <div class="video-grid"></div>
</section>

<section class="category" id="bhangra" data-category="Bhangra">
  <h2>Bhangra</h2>
  <div class="video-grid"></div>
</section>

<section class="category" id="garba" data-category="Garba">
  <h2>Garba</h2>
  <div class="video-grid"></div>
</section>

<section class="category" id="marathi" data-category="Marathi">
  <h2>Marathi</h2>
  <div class="video-grid"></div>
</section>

<section class="category" id="bollywood-freestyle" data-category="Bollywood Freestyle">
  <h2>Bollywood Freestyle</h2>
  <div class="video-grid"></div>
</section>

<section class="category" id="english-spanish" data-category="English/Spanish">
  <h2>English/Spanish</h2>
  <div class="video-grid"></div>
</section>

</div>
<!-- end site-content -->

<script>
  const SITE_PASSWORD = "BollywoodFitness2025#";

  function checkPassword() {
    const input = document.getElementById('gate-input').value;
    const error = document.getElementById('gate-error');
    if (input === SITE_PASSWORD) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('site-content').style.display = 'block';
      sessionStorage.setItem('siteUnlocked', 'true');
    } else {
      error.textContent = 'Incorrect password, try again.';
    }
  }

  // Allow pressing Enter to submit
  document.getElementById('gate-input').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') checkPassword();
  });

  // Stay unlocked for the rest of the browser tab session
  if (sessionStorage.getItem('siteUnlocked') === 'true') {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('site-content').style.display = 'block';
  }

  // ---- Load videos from the API (new) ----
  const videosApiUrl = 'https://white-bush-0674ea910.4.azurestaticapps.net/api/videos';

  async function loadVideos() {
    const videoStatus = document.getElementById('video-status');
    videoStatus.textContent = 'Loading videos...';

    try {
      const response = await fetch(videosApiUrl);
      if (!response.ok) {
        throw new Error('API returned status ' + response.status);
      }
      const videoList = await response.json();
      renderVideos(videoList);
      videoStatus.textContent = '';
    } catch (loadError) {
      showLoadError(loadError);
    }
  }

  function renderVideos(videoList) {
    const categorySections = document.querySelectorAll('section.category');

    categorySections.forEach(function (categorySection) {
      const categoryName = categorySection.dataset.category;
      const videoGrid = categorySection.querySelector('.video-grid');
      videoGrid.innerHTML = '';

      const categoryVideos = videoList.filter(function (video) {
        return video.Category === categoryName;
      });

      if (categoryVideos.length === 0) {
        const comingSoonMessage = document.createElement('p');
        comingSoonMessage.className = 'coming-soon';
        comingSoonMessage.textContent = 'Coming soon';
        videoGrid.appendChild(comingSoonMessage);
        return;
      }

      categoryVideos.forEach(function (video) {
        const videoCard = document.createElement('div');
        videoCard.className = 'video-card';

        const videoFrame = document.createElement('iframe');
        videoFrame.src = 'https://www.youtube.com/embed/' + encodeURIComponent(video.YouTubeId);
        videoFrame.allowFullscreen = true;

        const videoCaption = document.createElement('div');
        videoCaption.className = 'caption';
        videoCaption.textContent = video.Title;

        videoCard.appendChild(videoFrame);
        videoCard.appendChild(videoCaption);
        videoGrid.appendChild(videoCard);
      });
    });
  }

  function showLoadError(loadError) {
    console.error('Could not load videos:', loadError);
    const videoStatus = document.getElementById('video-status');
    videoStatus.innerHTML = '';

    const errorMessage = document.createElement('p');
    errorMessage.textContent = 'Could not load videos. The database may be waking up.';

    const tryAgainButton = document.createElement('button');
    tryAgainButton.id = 'try-again-button';
    tryAgainButton.textContent = 'Try again';
    tryAgainButton.addEventListener('click', loadVideos);

    videoStatus.appendChild(errorMessage);
    videoStatus.appendChild(tryAgainButton);
  }

  loadVideos();
</script>

</body>
</html>
